[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-milestone-and-supervision-log"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
thesis-log = "thesis_milestone_and_supervision_log.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
